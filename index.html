        :root {

<script>
    (function() {
    'use strict';

    const CONFIG = {
        PRIMARY_API: 'https://quantummovestudio.dpdns.org/api/time/server',
        FALLBACK_APIS: [
            'https://quan.suning.com/getSysTime.do',
            'https://api.m.taobao.com/rest/api3.do?api=mtop.common.getTimestamp'
        ],
        START_YEAR: 2026,
        TIMEOUT: 5000
    };

    var yearEl = document.getElementById("year");
    if (!yearEl) {
        console.error('CopyrightYear: 未找到 #year 元素');
        return;
    }

    function setYear(currentYear) {
        if (currentYear === CONFIG.START_YEAR) {
            yearEl.textContent = CONFIG.START_YEAR;
        } else if (currentYear > CONFIG.START_YEAR) {
            yearEl.textContent = CONFIG.START_YEAR + "-" + currentYear;
        } else {
            yearEl.textContent = CONFIG.START_YEAR;
        }
    }

    function fallbackLocalYear() {
        console.warn('CopyrightYear: 所有时间源都失败，回退到本地时间');
        setYear(new Date().getFullYear());
    }

    function parseSuningResponse(data) {
        if (data && data.sysTime2) {
            return parseInt(data.sysTime2.slice(0, 4), 10);
        }
        return null;
    }

    function parseTaobaoResponse(data) {
        if (data && data.data && data.data.t) {
            return new Date(Number(data.data.t)).getFullYear();
        }
        return null;
    }

    function parseOwnServerResponse(data) {
        if (data && data.datetime) {
            var date = new Date(data.datetime);
            if (!isNaN(date.getTime())) {
                return date.getFullYear();
            }
        }
        if (data && data.timestamp) {
            var date = new Date(data.timestamp * 1000);
            if (!isNaN(date.getTime())) {
                return date.getFullYear();
            }
        }
        return null;
    }

    function fetchWithTimeout(url, options, timeout) {
        return Promise.race([
            fetch(url, options),
            new Promise(function(_, reject) {
                setTimeout(function() {
                    reject(new Error('请求超时'));
                }, timeout);
            })
        ]);
    }

    function fetchOwnServer() {
        return fetchWithTimeout(CONFIG.PRIMARY_API, {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
        }, CONFIG.TIMEOUT)
        .then(function(response) {
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            return response.json();
        })
        .then(function(data) {
            var year = parseOwnServerResponse(data);
            if (year) {
                console.log('CopyrightYear: 使用量方易动工作室的服务器时间', year);
                return year;
            }
            throw new Error('无法解析服务器响应');
        });
    }

    function fetchSuning() {
        return fetchWithTimeout(CONFIG.FALLBACK_APIS[0], {
            method: 'GET',
            mode: 'cors'
        }, CONFIG.TIMEOUT)
        .then(function(response) { return response.json(); })
        .then(function(data) {
            var year = parseSuningResponse(data);
            if (year) {
                console.log('CopyrightYear: 使用苏宁时间', year);
                return year;
            }
            throw new Error('苏宁响应解析失败');
        });
    }

    function fetchTaobao() {
        return fetchWithTimeout(CONFIG.FALLBACK_APIS[1], {
            method: 'GET',
            mode: 'cors'
        }, CONFIG.TIMEOUT)
        .then(function(response) { return response.json(); })
        .then(function(data) {
            var year = parseTaobaoResponse(data);
            if (year) {
                console.log('CopyrightYear: 使用淘宝时间', year);
                return year;
            }
            throw new Error('淘宝响应解析失败');
        });
    }

    function init() {
        fetchOwnServer()
            .then(setYear)
            .catch(function(err) {
                console.warn('量方易动工作室的服务器失败:', err.message);
                return fetchSuning();
            })
            .then(setYear)
            .catch(function(err) {
                console.warn('苏宁失败:', err.message);
                return fetchTaobao();
            })
            .then(setYear)
            .catch(function(err) {
                console.warn('淘宝失败:', err.message);
                fallbackLocalYear();
            });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();
</script>
<script>
(function() {
    'use strict';

    const BGM_KEY = 'ea_bgm_progress';
    const BGM_SOURCES = [
        'https://cdn.quantumtechexplorationcenter.dpdns.org/zhyuan-65535.wav',
        'https://quantummovestudio-overseascdn.github.io/EACDN/zhyuan-65535.wav'
    ];

    const audio = document.getElementById('bgm');
    if (!audio) return;

    let bgmIndex = 0;
    let switching = false;
    let restored = false;
    let playing = false;
    let lastSave = 0;

    function readProgress() {
        try {
            const v = parseFloat(localStorage.getItem(BGM_KEY));
            return isNaN(v) || v < 0 ? 0 : v;
        } catch (e) {
            return 0;
        }
    }

    function saveProgress() {
        if (!isFinite(audio.duration) || audio.duration <= 0) return;
        let t = audio.currentTime;
        if (t >= audio.duration - 0.5) t = 0;
        try {
            localStorage.setItem(BGM_KEY, String(t));
        } catch (e) {}
    }

    function restoreProgress() {
        if (restored) return;
        if (!isFinite(audio.duration) || audio.duration <= 0) return;
        restored = true;
        const p = readProgress();
        if (p > 0 && p < audio.duration) {
            try {
                audio.currentTime = p;
            } catch (e) {}
        }
    }

    if (audio.readyState >= 1) {
        restoreProgress();
    } else {
        audio.addEventListener('loadedmetadata', restoreProgress);
    }

    audio.addEventListener('timeupdate', function() {
        const now = Date.now();
        if (now - lastSave > 1000) {
            lastSave = now;
            saveProgress();
        }
    });

    window.addEventListener('pagehide', saveProgress);
    window.addEventListener('beforeunload', saveProgress);
    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'hidden') saveProgress();
    });

    const events = ['pointerdown', 'mousedown', 'click', 'touchstart', 'touchmove', 'keydown', 'scroll', 'wheel', 'mousemove'];

    function removeListeners() {
        events.forEach(function(ev) {
            window.removeEventListener(ev, onAny, true);
        });
    }

    function startPlay() {
        if (playing) return;
        restoreProgress();
        const p = audio.play();
        if (p && typeof p.then === 'function') {
            p.then(function() {
                playing = true;
                removeListeners();
            }).catch(function() {});
        } else {
            playing = true;
            removeListeners();
        }
    }

    function onAny() {
        startPlay();
    }

    events.forEach(function(ev) {
        window.addEventListener(ev, onAny, { passive: true, capture: true });
    });

    audio.addEventListener('playing', function() {
        playing = true;
        removeListeners();
    });

    window.addEventListener('load', startPlay);
    window.addEventListener('pageshow', startPlay);
    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') startPlay();
    });

    audio.addEventListener('error', function() {
        if (switching) return;
        if (bgmIndex >= BGM_SOURCES.length - 1) return;
        switching = true;

        const wasPlaying = playing || !audio.paused;
        let savedTime = 0;
        try {
            if (isFinite(audio.currentTime)) savedTime = audio.currentTime;
        } catch (e) {}
        if (!savedTime) savedTime = readProgress();

        bgmIndex++;
        audio.src = BGM_SOURCES[bgmIndex];
        audio.load();

        audio.addEventListener('loadedmetadata', function() {
            if (savedTime > 0 && isFinite(audio.duration) && savedTime < audio.duration) {
                try {
                    audio.currentTime = savedTime;
                } catch (e) {}
            }
            switching = false;
            if (wasPlaying || playing) {
                audio.play().then(function() {
                    playing = true;
                    removeListeners();
                }).catch(function() {});
            }
        }, { once: true });
    });

    startPlay();
})();
</script>
    <script>
   (function() {
    'use strict';

    const HISTORY_URLS = [
        'https://cdn.quantumtechexplorationcenter.dpdns.org/EA_DevelopmentHistoryList.js',
        'https://quantummovestudio-overseascdn.github.io/EACDN/EA_DevelopmentHistoryList.js'
    ];
    const SCRIPT_TIMEOUT = 8000;
    const fallbackData = [];

    let currentPage = 1;
    const itemsPerPage = 5;
    let loading = false;
    let loaded = false;

    function getData() {
        if (Array.isArray(window.EA_HISTORY_DATA) && window.EA_HISTORY_DATA.length > 0) {
            return window.EA_HISTORY_DATA;
        }
        return fallbackData;
    }

    function renderTimeline(page) {
        const timelineContainer = document.getElementById('timeline');
        const paginationContainer = document.getElementById('pagination');
        const data = getData();

        timelineContainer.innerHTML = '';
        paginationContainer.innerHTML = '';

        const totalPages = Math.ceil(data.length / itemsPerPage);
        const startIndex = (page - 1) * itemsPerPage;
        const pageData = data.slice(startIndex, startIndex + itemsPerPage);

        pageData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'timeline-card';

            const dateDiv = document.createElement('div');
            dateDiv.className = 'timeline-date';
            dateDiv.textContent = item.date;

            const titleDiv = document.createElement('div');
            titleDiv.className = 'timeline-title';
            titleDiv.textContent = item.title;

            const contributorDiv = document.createElement('div');
            contributorDiv.className = 'timeline-contributor';
            contributorDiv.textContent = item.contributor;

            card.appendChild(dateDiv);
            card.appendChild(titleDiv);
            card.appendChild(contributorDiv);
            timelineContainer.appendChild(card);
        });

        if (totalPages > 1) {
            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.textContent = '上一页';
            prevBtn.disabled = page === 1;
            prevBtn.addEventListener('click', () => {
                if (page > 1) { currentPage--; renderTimeline(currentPage); }
            });
            paginationContainer.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === page ? 'active' : ''}`;
                pageBtn.textContent = i;
                pageBtn.addEventListener('click', () => {
                    currentPage = i;
                    renderTimeline(currentPage);
                });
                paginationContainer.appendChild(pageBtn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.textContent = '下一页';
            nextBtn.disabled = page === totalPages;
            nextBtn.addEventListener('click', () => {
                if (page < totalPages) { currentPage++; renderTimeline(currentPage); }
            });
            paginationContainer.appendChild(nextBtn);
        }
    }

    function loadScript(url) {
        return new Promise(function(resolve, reject) {
            const script = document.createElement('script');
            let settled = false;

            const timer = setTimeout(function() {
                if (settled) return;
                settled = true;
                script.remove();
                reject(new Error('加载超时: ' + url));
            }, SCRIPT_TIMEOUT);

            function finish(fn, arg) {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                script.remove();
                fn(arg);
            }

            script.src = url;
            script.async = true;

            script.onload = function() {
                if (Array.isArray(window.EA_HISTORY_DATA) && window.EA_HISTORY_DATA.length > 0) {
                    finish(resolve, window.EA_HISTORY_DATA);
                } else {
                    finish(reject, new Error('脚本已执行但未写入有效数据: ' + url));
                }
            };

            script.onerror = function() {
                finish(reject, new Error('网络/加载失败: ' + url));
            };

            document.head.appendChild(script);
        });
    }

    function tryLoad(index) {
        if (index >= HISTORY_URLS.length) {
            return Promise.reject(new Error('所有数据源均失败'));
        }
        const url = HISTORY_URLS[index];
        console.log('EA: 尝试加载 ' + url);
        return loadScript(url).catch(function(err) {
            console.warn('EA: ' + url + ' 失败 (' + err.message + ')，尝试下一个');
            return tryLoad(index + 1);
        });
    }

    function loadRemoteData() {
        if (loading || loaded) return;
        loading = true;
        tryLoad(0)
            .then(function() {
                loaded = true;
                loading = false;
                currentPage = 1;
                renderTimeline(1);
                console.log('EA: 远程数据加载成功');
            })
            .catch(function(err) {
                loading = false;
                console.warn('EA: ' + err.message + '，使用内置保底数据');
                currentPage = 1;
                renderTimeline(1);
            });
    }

    renderTimeline(1);
    loadRemoteData();
})();
    </script>
